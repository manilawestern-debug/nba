<script>
function slug(name){
  return name.toLowerCase().replace(/[^a-z0-9 ]/g,"").replace(/\s+/g,"-");
}

function buildSources(home, away){
  const s = `${slug(home)}-vs-${slug(away)}`;
  return [
    `https://streamfree.app/player/basketball/${s}`,
    `https://streamfree.app/embed/basketball/${s}`
  ];
}

// 🔥 try only LIVE games
async function tryLiveGames(events){
  let liveGames = events.filter(g =>
    g.status.type.description === "In Progress"
  );

  if (liveGames.length === 0){
    document.getElementById("player").src = "";
    return;
  }

  playGameList(liveGames, 0);
}

// 🔁 try per game
function playGameList(list, index){
  if (index >= list.length) return;

  let g = list[index];
  let teams = g.competitions[0].competitors;

  let home = teams.find(t=>t.homeAway==="home").team.displayName;
  let away = teams.find(t=>t.homeAway==="away").team.displayName;

  let sources = buildSources(home, away);

  trySources(sources, 0, () => {
    // pag fail → next game
    playGameList(list, index + 1);
  });
}

// 🔁 try per source
function trySources(sources, index, onFail){
  if (index >= sources.length){
    onFail();
    return;
  }

  let player = document.getElementById("player");
  player.src = sources[index];

  setTimeout(() => {
    // simple fallback check
    if (player.src.includes("streamfree")){
      trySources(sources, index + 1, onFail);
    }
  }, 4000);
}

// 🎯 LOAD NBA
async function loadGames(){
  let res = await fetch("https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard");
  let data = await res.json();

  render(data.events);
  tryLiveGames(data.events);
}

// 🎨 UI
function render(events){
  let html = "";

  events.forEach(g=>{
    let teams = g.competitions[0].competitors;

    let home = teams.find(t=>t.homeAway==="home").team.displayName;
    let away = teams.find(t=>t.homeAway==="away").team.displayName;

    let live = g.status.type.description === "In Progress";

    html += `
    <div class="card" onclick="manualPlay('${home}','${away}')">
      ${home} vs ${away}
      ${live ? '<span style="color:red">LIVE</span>' : ''}
    </div>`;
  });

  document.getElementById("games").innerHTML = html;
}

// manual click
function manualPlay(home,away){
  let sources = buildSources(home,away);
  trySources(sources, 0, ()=>{});
}

// start
loadGames();
setInterval(loadGames, 300000);
</script>
