<!DOCTYPE html>
<html>
<head>
  <title>NBA Live Premium</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(180deg, #0b0b0b, #000);
      color: #fff;
    }

    .header {
      padding: 14px 16px;
      background: rgba(0,0,0,0.9);
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #222;
      position: sticky;
      top: 0;
      z-index: 5;
    }

    .logo {
      font-weight: bold;
      color: #ff3c3c;
      letter-spacing: .5px;
    }

    .live {
      color: #ff3c3c;
      font-weight: bold;
    }

    .container {
      padding: 14px;
      max-width: 980px;
      margin: auto;
    }

    .player-box {
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 0 25px rgba(0,0,0,0.7);
      background: #000;
    }

    iframe {
      width: 100%;
      height: 62vh;
      border: none;
      display: none;
      background: #000;
    }

    /* Overlay */
    #overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.88);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      text-align: center;
      padding: 20px;
    }

    #overlay h1 {
      margin: 0 0 8px 0;
      font-size: 22px;
    }

    #overlay p {
      margin: 0;
      color: #aaa;
      font-size: 13px;
    }

    .info {
      margin-top: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .viewers {
      color: #aaa;
      font-size: 14px;
    }

    .btn {
      padding: 7px 12px;
      background: #1a1a1a;
      border: none;
      color: #fff;
      border-radius: 6px;
      cursor: pointer;
    }

    .btn:hover {
      background: #333;
    }

    .games {
      margin-top: 16px;
    }

    .game {
      padding: 11px;
      background: #111;
      margin-bottom: 8px;
      border-radius: 8px;
      cursor: pointer;
      transition: .2s;
      font-size: 14px;
    }

    .game:hover {
      background: #222;
      transform: scale(1.02);
    }

    .active {
      border: 1px solid #ff3c3c;
    }
  </style>
</head>

<body>

<div class="header">
  <div class="logo">NBA PREMIUM</div>
  <div class="live">● LIVE</div>
</div>

<div class="container">

  <div class="player-box">

    <!-- Overlay (anti-redirect first click) -->
    <div id="overlay" onclick="startStream()">
      <h1>▶ Tap to Watch</h1>
      <p>Click once to start (may open 1 tab depende sa source)</p>
    </div>

    <!-- Player -->
    <iframe id="player"
      sandbox="allow-scripts allow-presentation"
      allowfullscreen>
    </iframe>

  </div>

  <div class="info">
    <div class="viewers">👁 <span id="viewCount">0</span> watching</div>
    <div>
      <button class="btn" onclick="reloadPlayer()">Reload</button>
    </div>
  </div>

  <!-- Game list -->
  <div class="games">
    <div class="game active" onclick="setGame(this,'oklahoma-city-thunder-vs-phoenix-suns')">
      Thunder vs Suns
    </div>

    <div class="game" onclick="setGame(this,'detroit-pistons-vs-orlando-magic')">
      Pistons vs Magic
    </div>

    <div class="game" onclick="setGame(this,'lakers-vs-warriors')">
      Lakers vs Warriors
    </div>
  </div>

</div>

<script>
let currentGame = "oklahoma-city-thunder-vs-phoenix-suns";

function startStream() {
  document.getElementById("overlay").style.display = "none";

  const iframe = document.getElementById("player");
  iframe.style.display = "block";
  iframe.src = "https://streamfree.app/embed/basketball/minnesota-timberwolves-vs-denver-nuggets" + currentGame;
}

function setGame(el, game) {
  currentGame = game;

  // highlight active
  document.querySelectorAll(".game").forEach(g => g.classList.remove("active"));
  el.classList.add("active");

  // reset overlay (important para bawas redirect)
  document.getElementById("overlay").style.display = "flex";

  const iframe = document.getElementById("player");
  iframe.style.display = "none";
  iframe.src = "";
}

function reloadPlayer() {
  const iframe = document.getElementById("player");
  iframe.src = iframe.src;
}

// fake viewers
function updateViewers() {
  document.getElementById("viewCount").innerText =
    Math.floor(Math.random() * 4000) + 1000;
}
setInterval(updateViewers, 3000);
updateViewers();
</script>

</body>
</html>
