<!DOCTYPE html>
<html>
<head>
  <title>NBA Auto Stream</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      margin: 0;
      background: #000;
      font-family: Arial;
      color: white;
    }

    .header {
      padding: 12px;
      background: #111;
      display: flex;
      justify-content: space-between;
    }

    .live {
      color: red;
      font-weight: bold;
    }

    iframe {
      width: 100%;
      height: 60vh;
      border: none;
      background: black;
    }

    .info {
      padding: 10px;
      text-align: center;
      color: #aaa;
    }

    .btn {
      padding: 8px 12px;
      background: #222;
      border: none;
      color: white;
      border-radius: 6px;
      cursor: pointer;
    }

    .btn:hover {
      background: #333;
    }
  </style>
</head>

<body>

<div class="header">
  <div>NBA AUTO STREAM</div>
  <div class="live">● LIVE</div>
</div>

<!-- AUTO LOAD PLAYER -->
<iframe id="player"
  src="https://streamfree.app/embed/basketball/minnesota-timberwolves-vs-denver-nuggets"
  allow="autoplay; fullscreen"
  allowfullscreen>
</iframe>

<div class="info">
  ⚠️ If not playing, wait or reload
  <br><br>
  <button class="btn" onclick="reloadPlayer()">Reload</button>
</div>

<script>
const iframe = document.getElementById("player");

// 🔥 AUTO RELOAD TRY (every 5 sec kung ayaw mag load)
setInterval(() => {
  iframe.src = iframe.src;
}, 5000);

// 🔥 EXTRA FORCE RELOAD after 2 sec
window.onload = () => {
  setTimeout(() => {
    iframe.src = iframe.src;
  }, 2000);
};

// manual reload button
function reloadPlayer() {
  iframe.src = iframe.src;
}
</script>

</body>
</html>
