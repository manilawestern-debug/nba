<!DOCTYPE html>
<html>
<head>
  <title>NBA Live Stream</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #0b0b0b;
      color: white;
    }

    .header {
      padding: 15px;
      background: #111;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #222;
    }

    .title {
      font-size: 18px;
      font-weight: bold;
    }

    .live {
      color: red;
      font-weight: bold;
    }

    .container {
      padding: 10px;
    }

    iframe {
      width: 100%;
      height: 60vh;
      border: none;
      border-radius: 10px;
    }

    .info {
      margin-top: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .viewers {
      color: #aaa;
    }

    .btn {
      padding: 8px 12px;
      background: #222;
      border: none;
      color: white;
      border-radius: 6px;
      cursor: pointer;
    }

    .btn:hover {
      background: #333;
    }

    .games {
      margin-top: 20px;
    }

    .game {
      padding: 10px;
      background: #111;
      margin-bottom: 8px;
      border-radius: 6px;
      cursor: pointer;
    }

    .game:hover {
      background: #222;
    }
  </style>
</head>

<body>

<div class="header">
  <div class="title">NBA Live Stream</div>
  <div class="live">● LIVE</div>
</div>

<div class="container">

  <!-- VIDEO -->
  <iframe id="player"
    src="https://streamfree.app/embed/basketball/detroit-pistons-vs-orlando-magic"
    allowfullscreen>
  </iframe>

  <!-- INFO -->
  <div class="info">
    <div class="viewers">
      👁 <span id="viewCount">0</span> watching
    </div>

    <button class="btn" onclick="reloadPlayer()">Reload</button>
  </div>

  <!-- GAMES -->
  <div class="games">
    <div class="game" onclick="playGame('detroit-pistons-vs-orlando-magic')">
      Pistons vs Magic
    </div>

    <div class="game" onclick="playGame('lakers-vs-warriors')">
      Lakers vs Warriors
    </div>

    <div class="game" onclick="playGame('celtics-vs-bucks')">
      Celtics vs Bucks
    </div>
  </div>

</div>

<script>
  // fake viewers counter
  function updateViewers() {
    const count = Math.floor(Math.random() * 5000) + 1000;
    document.getElementById("viewCount").innerText = count;
  }

  setInterval(updateViewers, 3000);
  updateViewers();

  // switch game
  function playGame(game) {
    document.getElementById("player").src =
      "https://streamfree.app/embed/basketball/" + game;
  }

  // reload
  function reloadPlayer() {
    let player = document.getElementById("player");
    player.src = player.src;
  }
</script>

</body>
</html>
